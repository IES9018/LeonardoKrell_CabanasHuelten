name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  calidad:
    name: Lint · Tests · Presupuestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (dev)
        run: npm ci

      - name: Lint OpenAPI (contrato NV-3)
        run: npm run lint:api

      - name: Tests unitarios (Vitest + JSDOM)
        run: npm test

      - name: Presupuestos de peso (RNF-03/04)
        run: npm run budgets

      - name: Smoke check de artefactos
        run: |
          node --check app.js
          test -f index.html
          test -f styles.css
